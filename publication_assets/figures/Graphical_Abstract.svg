<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">WHEN-TO-WAKE ABI graphical abstract</title>
  <desc id="desc">Adults with acute brain injury receiving mechanical ventilation were evaluated at repeated stable decision points. Early sedation de-escalation within six hours was compared with continued sedation for 24 hours. MIMIC-IV showed a 7.7 percentage-point risk difference and the eICU proxy analysis showed a 4.0 percentage-point risk difference.</desc>
  <rect width="920" height="300" fill="#FFFFFF"/>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .ink { fill: #26343D; }
    .muted { fill: #687782; }
    .blue { fill: #496F82; }
    .teal { fill: #5E817A; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }
    .body { font-size: 14px; }
    .small { font-size: 12px; }
  </style>

  <text x="26" y="43" class="sans ink" font-size="27" font-weight="700" letter-spacing="0.5">WHEN-TO-WAKE ABI</text>

  <rect x="26" y="62" width="253" height="180" rx="2" fill="#F3F5F6" stroke="#D8DEE1" stroke-width="1.5"/>
  <rect x="307" y="62" width="305" height="180" rx="2" fill="#FFFFFF" stroke="#D8DEE1" stroke-width="1.5"/>
  <rect x="640" y="62" width="254" height="180" rx="2" fill="#F3F5F6" stroke="#D8DEE1" stroke-width="1.5"/>

  <text x="44" y="88" class="sans muted label">POPULATION</text>
  <text x="44" y="131" class="sans ink" font-size="20" font-weight="700">Adults with acute</text>
  <text x="44" y="155" class="sans ink" font-size="20" font-weight="700">brain injury</text>
  <text x="44" y="203" class="sans muted body">Mechanical ventilation</text>
  <text x="44" y="222" class="sans muted body">Repeated stable decisions</text>

  <text x="325" y="88" class="sans muted label">SEQUENTIAL STRATEGY CONTRAST</text>
  <rect x="344" y="110" width="231" height="32" rx="3" fill="#EDF2F4" stroke="#496F82" stroke-width="1.6"/>
  <text x="459.5" y="131" text-anchor="middle" class="sans ink body">Early de-escalation within 6 h</text>
  <text x="459.5" y="161" text-anchor="middle" class="sans muted small">versus</text>
  <rect x="349" y="175" width="221" height="32" rx="3" fill="#FFFFFF" stroke="#687782" stroke-width="1.6"/>
  <text x="459.5" y="196" text-anchor="middle" class="sans ink body">Continued sedation for 24 h</text>
  <text x="459.5" y="228" text-anchor="middle" class="sans muted small">Clone-censor-weight estimation</text>

  <text x="658" y="88" class="sans muted label">DAY-7 LIBERATION</text>
  <text x="658" y="128" class="sans blue" font-size="22" font-weight="700">MIMIC-IV</text>
  <text x="876" y="128" text-anchor="end" class="sans blue" font-size="22" font-weight="700">+7.7 pp</text>
  <text x="658" y="151" class="sans ink body">95% CI 4.4 to 11.0</text>
  <text x="658" y="190" class="sans teal" font-size="20" font-weight="700">eICU proxy</text>
  <text x="876" y="190" text-anchor="end" class="sans teal" font-size="20" font-weight="700">+4.0 pp</text>
  <text x="658" y="213" class="sans ink body">95% CI -2.5 to 11.1</text>

  <text x="26" y="275" class="sans muted small">Observational associations; eICU used a non-equivalent ventilation-end proxy.</text>
</svg>
